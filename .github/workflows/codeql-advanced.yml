name: CodeQL Advanced

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "35 6 * * 5"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 360

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The repository's Swift sources belong to the Flutter macOS project.
      # Flutter generates macos/Flutter/ephemeral and workspace metadata during
      # dependency resolution/build, so CodeQL autobuild cannot run first.
      - name: Set up Flutter for Swift analysis
        if: matrix.language == 'swift'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      - name: Build Flutter macOS for Swift extraction
        if: matrix.language == 'swift' && matrix.build-mode == 'manual'
        working-directory: korea_sec_app
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
