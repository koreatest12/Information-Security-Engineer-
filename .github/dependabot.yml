# Repository-wide dependency update policy.
# GitHub reads this file only from .github/dependabot.yml on the default branch.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: &weekly_schedule
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 20
    rebase-strategy: "auto"
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      all-github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "npm"
    directories: &recursive_directories
      - "/"
      - "**/*"
    schedule: *weekly_schedule
    open-pull-requests-limit: 20
    rebase-strategy: "auto"
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    groups:
      all-npm-dependencies:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "pip"
    directories: *recursive_directories
    schedule: *weekly_schedule
    open-pull-requests-limit: 20
    rebase-strategy: "auto"
    labels: ["dependencies", "python"]
    commit-message:
